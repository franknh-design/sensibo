# Kinomodus — vinduslys og lyset bak sofaen av når TV-en spiller, på igjen når filmen slås av.
# Lim inn i Home Assistant: Innstillinger → Automasjoner → Opprett → ⋮ → Rediger i YAML.
# Bytt ut entity-ID-ene under (finnes i Innstillinger → Enheter og tjenester → Entiteter).
alias: Kinomodus
description: Lys av når vi ser film, på igjen når filmen slås av
mode: queued
triggers:
  - trigger: state
    entity_id: media_player.stue_tv          # ← TV-en / Apple TV
    to: playing
    id: start
  - trigger: state
    entity_id: media_player.stue_tv          # ← samme som over
    from: [playing, paused]
    to: "off"                                 # TV-en slått av → lyset på med en gang
    id: stopp
  - trigger: state
    entity_id: media_player.stue_tv          # ← samme som over
    from: [playing, paused]
    to: [idle, standby]
    for: "00:02:00"                           # filmen ferdig, TV-en står på menyen i 2 min (pause teller ikke)
    id: stopp
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: start
        sequence:
          - action: light.turn_off
            target:
              entity_id: &lys
                - light.vinduslys             # ← vinduslys
                - light.lys_bak_sofa          # ← lyset bak sofaen
      - conditions:
          - condition: trigger
            id: stopp
        sequence:
          - action: light.turn_on
            target:
              entity_id: *lys
